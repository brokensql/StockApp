<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E9678" />
      <stop offset="100%" stop-color="#3A634E" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14261C" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base rounded rectangle for standard icon -->
  <rect width="512" height="512" rx="112" fill="url(#sageGrad)" />

  <!-- Sage / Leaf & Inventory Package Hybrid Motif -->
  <g filter="url(#subtleShadow)" transform="translate(106, 106)">
    <!-- Main Inventory Box / Geometric Icon -->
    <path
      d="M150 20 L270 90 L270 210 L150 280 L30 210 L30 90 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="20"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Top facets of isometric box -->
    <path
      d="M150 20 L150 150 M30 90 L150 150 L270 90"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="18"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Vertical crease -->
    <path
      d="M150 150 L150 280"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="18"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Accent Sage Leaf sprouting from package -->
    <path
      d="M150 24 C150 24 190 -30 240 -10 C240 -10 230 40 180 30"
      fill="#D5E8DD"
      stroke="#FFFFFF"
      stroke-width="8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path
      d="M155 20 C180 6 210 0 235 -8"
      fill="none"
      stroke="#3A634E"
      stroke-width="6"
      stroke-linecap="round"
    />
  </g>
</svg>
